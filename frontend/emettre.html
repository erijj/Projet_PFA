<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCert — Émettre un Certificat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Jost:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    .issuance-layout { display: flex; gap: 30px; padding: 30px; min-height: calc(100vh - 70px); }
    .form-side { flex: 0 0 450px; }
    .preview-side { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .issuance-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
    .issuance-title { font-family: var(--ff); font-size: 1.5rem; color: white; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
    .input-group input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; color: white; font-size: 0.9rem; transition: var(--transition); outline: none; }
    .input-group input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(217, 219, 241, 0.1); background: rgba(0,0,0,0.3); }
    
    /* Live Preview Container */
    .preview-container { width: 100%; max-width: 600px; position: sticky; top: 100px; }
    .preview-header { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    
    /* Small Cert Style for Preview */
    .cert-preview-box { background: white; width: 100%; min-height: 700px; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; color: #1a2a40; }
    
    .status-bar { background: rgba(34,212,160,0.1); border: 1px solid rgba(34,212,160,0.2); padding: 8px 15px; border-radius: 12px; color: var(--accent-green); font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
    .pulse { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,212,160,0.4); } 70% { box-shadow: 0 0 0 10px rgba(34,212,160,0); } 100% { box-shadow: 0 0 0 0 rgba(34,212,160,0); } }

    .btn-issue { width: 100%; padding: 14px; border-radius: 14px; background: var(--grad); color: white; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; box-shadow: 0 10px 20px rgba(217, 219, 241, 0.3); }
    .btn-issue:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(217, 219, 241, 0.4); }
    .btn-issue:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="topbar">
    <div class="container-fluid d-flex align-items-center">
      <a class="navbar-brand" href="dashboard-admin.html">
        <div class="d-flex align-items-center gap-2">
          <div class="logo-icon"><img src="logo.png" alt="logo"></div>
          <div>
            <div class="logo-text">SmartCert</div>
            <div class="logo-sub">DIGITALISEZ VOTRE REUSSITE</div>
          </div>
        </div>
      </a>
      <div class="ms-auto d-flex gap-3">
        <div id="apiStatusBar"></div>
        <a href="dashboard-admin.html" class="btn btn-ghost btn-sm"><i class="fas fa-arrow-left"></i> Retour au Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="issuance-layout">
    <!-- FORM SIDE -->
    <div class="form-side">
      <div class="issuance-card">
        <div class="issuance-title"><i class="fas fa-certificate"></i> Détails de la Certification</div>
        <div class="status-bar">
          <div class="pulse"></div>
          <span>Blockchain Connectée · Réseau Ethereum</span>
        </div>
        
        <div class="input-group">
          <label><i class="fas fa-user"></i> Nom du Bénéficiaire</label>
          <input type="text" id="f-name" placeholder="ex: Ahmed Ben Ali" oninput="updatePreview()">
        </div>
        
        <div class="input-group">
          <label><i class="fas fa-envelope"></i> Adresse Email</label>
          <input type="email" id="f-email" placeholder="ex: ahmed@email.tn">
        </div>
        
        <div class="input-group">
          <label><i class="fas fa-graduation-cap"></i> Programme / Diplôme</label>
          <input type="text" id="f-program" placeholder="ex: Licence en Informatique" oninput="updatePreview()">
        </div>
        
        <div class="input-group">
          <label><i class="fas fa-university"></i> Institution</label>
          <input type="text" id="f-institution" placeholder="ex: Université de Tunis" oninput="updatePreview()">
        </div>

        <div class="input-group">
          <label><i class="fas fa-signature"></i> Nom du Signataire (Directeur)</label>
          <input type="text" id="f-director" placeholder="ex: Dr. Ahmed Mansouri" oninput="updatePreview()">
        </div>

        <div class="input-group">
          <label><i class="fas fa-calendar-alt"></i> Date d'émission</label>
          <input type="date" id="f-date" oninput="updatePreview()">
        </div>

        <button class="btn-issue" id="issueBtn" onclick="issueCertificate()">
          <i class="fas fa-link"></i> Émettre sur Blockchain
        </button>
        <button class="btn btn-ghost w-100 mt-3" onclick="resetForm()">Réinitialiser</button>
      </div>
    </div>

    <!-- PREVIEW SIDE -->
    <div class="preview-side">
      <div class="preview-container">
        <div class="preview-header"><i class="fas fa-eye"></i> Aperçu en temps réel</div>
        <div id="certPreviewArea">
          <!-- The certificate HTML will be injected here by JS -->
        </div>
      </div>
    </div>
  </div>

  <div id="toastBox" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1000"></div>

<script>
  const POSSIBLE = ['http://127.0.0.1:5000', 'http://localhost:5000'];
  let API = localStorage.getItem('smartcert_api') || 'http://127.0.0.1:5000';

  async function findBackend() {
    const token = localStorage.getItem('smartcert_token');
    for (const u of POSSIBLE) {
      try {
        const r = await fetch(u+'/chain/status', {
          headers: { 'Authorization': `Bearer ${token}` },
          signal: AbortSignal.timeout(2000)
        });
        if (r.ok) { API = u; localStorage.setItem('smartcert_api', u); return true; }
      } catch {}
    }
    return false;
  }

  async function checkBackend() {
    const ok = await findBackend();
    const bar = document.getElementById('apiStatusBar');
    if (!ok) {
      bar.innerHTML = '<span class="badge bg-danger">Backend Hors-ligne</span>';
      document.getElementById('issueBtn').disabled = true;
    } else {
      bar.innerHTML = '<span class="badge bg-success">Backend Connecté</span>';
      document.getElementById('issueBtn').disabled = false;
    }
  }

  function updatePreview() {
    const name = document.getElementById('f-name').value.trim() || '—';
    const prog = document.getElementById('f-program').value.trim() || '—';
    const inst = document.getElementById('f-institution').value.trim() || 'Université de Monastir';
    const date = document.getElementById('f-date').value || new Date().toISOString().split('T')[0];
    const director = document.getElementById('f-director').value.trim() || 'Nom du Directeur';

    document.getElementById('certPreviewArea').innerHTML = buildCertHTML({
      recipient_name: name, program: prog,
      institution: inst, issue_date: date,
      director_name: director
    });
  }

  function buildCertHTML(d) {
    const dateStr = d.issue_date ? new Date(d.issue_date).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' }) : '—';
    return `
      <div class="cert-preview-box" style="background:white; padding:25px 20px; text-align:center; display:flex; flex-direction:column; border: 8px double #C9A03D; color:#1e133a; width:100%; max-width:550px; margin:0 auto; font-family:'Cormorant Garamond', serif; position:relative; box-sizing:border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.1); min-height:720px;">
        
        <div style="font-family:'Jost', sans-serif; font-size:10px; letter-spacing:4px; font-weight:500; margin-bottom:10px; color:#416165;">
          ${(d.institution || 'UNIVERSITÉ DE MONASTIR').toUpperCase()}
        </div>
        
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:5px;">
          <div style="font-size:36px; font-weight:700; letter-spacing:5px; margin:0; color:#1e133a;">CERTIFICAT</div>
          <div style="font-family:'Jost', sans-serif; font-size:7px; letter-spacing:3px; color:#ACB0BD; margin-bottom:15px; text-transform:uppercase;">DE RÉUSSITE — CERTIFICATE OF ACHIEVEMENT</div>
          
          <div style="font-family:'Jost', sans-serif; font-size:11px; color:#94a3b8; font-style:italic;">La présente certifie que</div>
          <div style="font-size:28px; font-weight:700; color:#1e133a; margin:5px 0;">${d.recipient_name}</div>
          <div style="width:120px; height:1px; background:linear-gradient(90deg, transparent, #C9A03D, transparent); margin:10px auto;"></div>
          
          <div style="font-family:'Jost', sans-serif; font-size:11px; color:#ACB0BD;">a complété avec succès le programme</div>
          <div style="font-size:18px; font-weight:700; color:#416165; margin-top:5px; padding:0 10px;">${d.program}</div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:30px; border-top:1px solid #F0F0F0; padding-top:20px;">
          
          <!-- Left: Ethereum Seal -->
          <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
            <img src="ethereum_seal.png" alt="Ethereum Seal" style="width:70px; height:70px; object-fit:contain; margin-bottom:5px;" />
            <div style="font-family:'Jost', sans-serif; font-size:7px; color:#94a3b8; text-transform:uppercase;">Date d'émission</div>
            <div style="font-family:'Jost', sans-serif; font-size:11px; font-weight:700; color:#1e133a;">${dateStr}</div>
          </div>
          
          <!-- Middle: Director -->
          <div style="flex:1; display:flex; flex-direction:column; align-items:center; padding-bottom:5px;">
             <div style="font-size:22px; font-weight:700; color:#1e133a; margin-bottom:2px; font-style:italic;">Directeur</div>
             <div style="width:80px; height:1px; background:#1e133a; margin-bottom:5px;"></div>
             <div style="font-family:'Jost', sans-serif; font-size:10px; color:#94a3b8; font-weight:700; text-transform:uppercase;">${(d.director_name || 'Nom du Directeur').toUpperCase()}</div>
          </div>
          
          <!-- Right: QR Code -->
          <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
             <div style="padding:5px; background:#F9F9F9; border-radius:5px; border:1px solid #EEE;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=PREVIEW" style="width:40px; height:40px; display:block;">
             </div>
             <div style="font-family:'Jost', sans-serif; font-size:6px; color:#C9A03D; font-weight:700; text-transform:uppercase; margin-top:5px;">Verified on Blockchain</div>
             <div style="font-family:'Space Mono', monospace; font-size:6px; color:#94a3b8;">TX: 0xGEN_IN...</div>
          </div>
          
        </div>
      </div>
    `;
  }

  async function issueCertificate() {
    const name = document.getElementById('f-name').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const prog = document.getElementById('f-program').value.trim();
    const inst = document.getElementById('f-institution').value.trim();
    const date = document.getElementById('f-date').value;
    const director = document.getElementById('f-director').value.trim();

    if (!name || !email || !prog) {
      toast('Veuillez remplir les champs obligatoires (*)', 'error');
      return;
    }

    const btn = document.getElementById('issueBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Émission en cours…';

    try {
      const token = localStorage.getItem('smartcert_token');
      const res = await fetch(`${API}/certificates`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
          recipient_name: name, email, program: prog,
          institution: inst || 'SmartCert University', 
          issue_date: date,
          director_name: director
        })
      });
      const data = await res.json();

      if (res.ok) {
        toast('✅ Certificat émis avec succès sur la Blockchain !', 'success');
        setTimeout(() => window.location.href = 'dashboard-admin.html', 1500);
      } else {
        toast('❌ Erreur: ' + (data.error || 'Impossible d\'émettre'), 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-link"></i> Émettre sur Blockchain';
      }
    } catch (err) {
      toast('❌ Erreur de connexion au serveur', 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-link"></i> Émettre sur Blockchain';
    }
  }

  function resetForm() {
    document.querySelectorAll('input').forEach(i => i.value = '');
    document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
    updatePreview();
  }

  function toast(msg, type='success') {
    const box = document.getElementById('toastBox');
    const div = document.createElement('div');
    div.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show`;
    div.innerHTML = `${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
    box.appendChild(div);
    setTimeout(() => div.remove(), 4000);
  }

  window.addEventListener('load', () => {
    document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
    updatePreview();
    checkBackend();
  });
</script>
</body>
</html>
