<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCert — Espace Étudiant</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --navy: #001D39;
      --blue1: #0A4174;
      --teal: #4E8EA2;
      --sky: #6EA2B3;
      --accent: #7BBDE8;
      --pale: #BDD8E9;
      --green: #10b981;
      --red: #ef4444;
      --border: rgba(78, 142, 162, 0.22);
      --card: rgba(10, 65, 116, 0.45);
      --grad: linear-gradient(135deg, #0A4174, #4E8EA2)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      min-height: 100vh;
      font-family: 'Syne', sans-serif;
      background: var(--navy);
      color: var(--pale)
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(78, 142, 162, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(78, 142, 162, .035) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      z-index: 0
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: rgba(0, 29, 57, .94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center
    }

    .brand-logo img.logo-img {
      width: 90px;
      height: 60px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
      transition: transform .2s ease
    }

    .brand-logo img.logo-img:hover {
      transform: scale(1.05)
    }

    .brand-name {
      font-weight: 800;
      font-size: 21px;
      background: linear-gradient(90deg, var(--accent), var(--pale));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text
    }

    .brand-sub {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: var(--sky);
      letter-spacing: 2px;
      text-transform: uppercase
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 13px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--sky)
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 2s infinite
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    .btn-logout {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(239, 68, 68, .08);
      border: 1px solid rgba(239, 68, 68, .25);
      border-radius: 8px;
      color: #ef4444;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      transition: all .2s;
      text-decoration: none
    }

    .main {
      flex: 1;
      display: flex;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 24px;
      gap: 28px;
      flex-wrap: wrap
    }

    .left {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .student-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 24px rgba(78, 142, 162, .4)
    }

    .student-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--pale)
    }

    .student-email {
      font-size: 12px;
      color: var(--sky)
    }

    .student-badge {
      padding: 4px 12px;
      background: rgba(16, 185, 129, .1);
      border: 1px solid rgba(16, 185, 129, .25);
      border-radius: 20px;
      font-size: 11px;
      color: var(--green);
      font-weight: 600
    }

    .info-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px
    }

    .info-title {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: var(--sky);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 14px
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(78, 142, 162, .1)
    }

    .info-row:last-child {
      border-bottom: none
    }

    .info-label {
      font-size: 12px;
      color: var(--sky)
    }

    .info-val {
      font-size: 12px;
      color: var(--pale);
      font-weight: 600;
      font-family: 'Space Mono', monospace
    }

    .right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 22px
    }

    .search-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden
    }

    .card-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--pale)
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--sky);
      margin-top: 1px
    }

    .card-body {
      padding: 22px
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .api-status.err {
      background: rgba(239, 68, 68, .08);
      border: 1px solid rgba(239, 68, 68, .22);
      color: var(--red)
    }

    .search-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 20px
    }

    .cert-input {
      flex: 1;
      background: rgba(0, 0, 0, .3);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--pale);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color .2s
    }

    .cert-input:focus {
      border-color: var(--accent)
    }

    .cert-input::placeholder {
      color: rgba(110, 162, 179, .6)
    }

    .btn-verify {
      padding: 12px 22px;
      background: var(--grad);
      border: none;
      border-radius: 10px;
      color: white;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .2s;
      box-shadow: 0 0 18px rgba(78, 142, 162, .3)
    }

    .btn-verify:hover {
      transform: translateY(-2px)
    }

    .btn-verify:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none
    }

    .result-wrap {
      opacity: 1;
      transform: none
    }

    /* No animation to prevent flickering */
    .result-invalid {
      background: rgba(239, 68, 68, .07);
      border: 1px solid rgba(239, 68, 68, .25);
      border-radius: 12px;
      padding: 22px
    }

    .btn-pdf {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      padding: 10px 20px;
      background: rgba(16, 185, 129, .1);
      border: 1px solid rgba(16, 185, 129, .3);
      border-radius: 8px;
      color: var(--green);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none
    }

    .btn-pdf:hover {
      background: rgba(16, 185, 129, .2)
    }

    .hash-label {
      font-size: 10px;
      color: var(--sky);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
      margin-top: 16px
    }

    .hash-box {
      background: rgba(0, 0, 0, .3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      word-break: break-all;
      line-height: 1.8
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(78, 142, 162, .25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      display: inline-block;
      vertical-align: middle
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .toast-box {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .toast {
      background: rgba(10, 65, 116, .92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--pale);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
      min-width: 240px;
      animation: slideIn .3s ease
    }

    .toast.success {
      border-left: 3px solid var(--green)
    }

    .toast.error {
      border-left: 3px solid var(--red)
    }

    @keyframes slideIn {
      from {
        transform: translateX(110%);
        opacity: 0
      }

      to {
        transform: translateX(0);
        opacity: 1
      }
    }

    @media(max-width:720px) {
      .main {
        flex-direction: column
      }

      .left {
        width: 100%
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <img src="logo.png" alt="SmartCert" class="logo-img"
            onerror="this.style.display='none';this.parentElement.innerHTML='<span style=font-weight:700;color:#0A4174;font-size:14px>SC</span>'">
        </div>

        <div>
          <div class="brand-name">SmartCert</div>
          <div class="brand-sub">Espace Étudiant</div>
        </div>
      </div>
      <div class="header-right">
        <div class="pill">
          <div class="dot"></div><span>Ethereum Testnet</span>
        </div>
        <a href="#" onclick="logout(); return false;" class="btn-logout">⎋ Déconnexion</a>

      </div>
    </header>

    <div class="main">
      <div class="left">
        <div class="student-card">
          <div class="avatar" id="studentAvatar">E</div>
          <div class="student-name" id="studentName">Étudiant</div>
          <div class="student-email" id="studentEmail">—</div>
          <div class="student-badge">✓ Accès vérifié</div>
        </div>
        <div class="info-panel">
          <div class="info-title">ℹ️ Comment ça marche</div>
          <div class="info-row"><span class="info-label">Étape 1</span><span class="info-val">Saisir ID</span></div>
          <div class="info-row"><span class="info-label">Étape 2</span><span class="info-val">Vérifier</span></div>
          <div class="info-row"><span class="info-label">Étape 3</span><span class="info-val">Télécharger</span></div>
          <div class="info-row"><span class="info-label">Format</span><span class="info-val">CERT-XXXX</span></div>
          <div class="info-row"><span class="info-label">Réseau</span><span class="info-val">Ethereum</span></div>
        </div>
      </div>

      <div class="right">
        <div class="search-card">
          <div class="card-header">
            <span style="font-size:18px">🔍</span>
            <div>
              <div class="card-title">Vérifier un Certificat</div>
              <div class="card-subtitle">Vérification instantanée via la blockchain Ethereum</div>
            </div>
          </div>
          <div class="card-body">
            <div id="apiStatusBar"></div>
            <form class="search-wrap" onsubmit="event.preventDefault(); verifyCert(); return false;">
              <input class="cert-input" id="certIdInput" placeholder="Ex : CERT-2024-A1B2C3">
              <button type="submit" class="btn-verify" id="verifyBtn">⚡ Vérifier</button>
            </form>
            <div id="finalCertOutput" style="min-height:20px; margin-top:20px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast-box" id="toastBox"></div>

  <!-- COMPOSANT CERTIFICAT — identique dans les 2 pages -->
  <script>
    function buildCertHTML(d) {
      const name = escH(d.recipient_name || d.name || '—');
      const prog = escH(d.program || d.programme || '—');
      const inst = escH(d.institution || 'UNIVERSITÉ DE MONASTIR');
      const date = ((d.issue_date || d.date || '—').split('T')[0]);
      const cid = escH(d.id || d.cert_id || '—');
      const tx = escH(d.tx_hash || '0x4f8948bc43...');
      const director = escH(d.director_name || 'Directeur des Études');

      const dateFr = (() => {
        try {
          if (date === '—') return '—';
          return new Date(date).toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric' });
        } catch { return date; }
      })();

      return `
  <div style="background:white; border:8px double #C9A03D; padding:30px 20px; position:relative; box-shadow:0 15px 45px rgba(0,0,0,0.1); font-family:'Cormorant Garamond', serif; width:100%; max-width:650px; margin:0 auto; color:#1A2A4F; text-align:center; min-height:800px; display:flex; flex-direction:column; box-sizing:border-box;">
    
    <!-- Header -->
    <div style="font-family:'Jost', sans-serif; font-size:12px; letter-spacing:4px; font-weight:500; margin-bottom:10px; color:#0A4174;">
      ${inst.toUpperCase()}
    </div>
    
    <div style="font-size:45px; font-weight:700; letter-spacing:6px; margin-bottom:2px; color:#1A2A4F;">
      CERTIFICAT
    </div>
    
    <div style="font-family:'Jost', sans-serif; font-size:9px; letter-spacing:3px; color:#6A8FAA; margin-bottom:30px; text-transform:uppercase;">
      DE RÉUSSITE — CERTIFICATE OF ACHIEVEMENT
    </div>

    <!-- Body -->
    <div style="font-family:'Jost', sans-serif; font-size:12px; color:#4E8EA2; margin-bottom:8px; font-style:italic;">
      La présente certifie que
    </div>
    
    <div style="font-size:38px; font-weight:700; color:#1A2A4F; margin-bottom:5px; line-height:1.2;">
      ${name}
    </div>
    
    <div style="width:180px; height:1px; background:linear-gradient(90deg, transparent, #C9A03D, transparent); margin:15px auto;"></div>
    
    <div style="font-family:'Jost', sans-serif; font-size:12px; color:#6A8FAA; margin-bottom:8px;">
      a complété avec succès le programme
    </div>
    
    <div style="font-size:24px; font-weight:700; color:#0A4174; margin-bottom:auto; padding:0 20px;">
      ${prog}
    </div>

    <!-- Bottom Section -->
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:40px; border-top:1px solid #F0F0F0; padding-top:30px;">
      
      <!-- Left: Date & Ethereum Seal -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
        <div style="margin-bottom:10px;">
          <img src="ethereum_seal.png" alt="Ethereum Seal" style="width:85px; height:85px; object-fit:contain; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.1));" />
        </div>
        <div style="font-family:'Jost', sans-serif; font-size:8px; color:#8AACBE; text-transform:uppercase;">Date d'émission</div>
        <div style="font-family:'Jost', sans-serif; font-size:13px; font-weight:700; color:#1A2A4F; margin-top:3px;">${dateFr}</div>
      </div>
      
      <!-- Middle: Director -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; padding-bottom:10px;">
        <div style="font-size:22px; font-weight:700; color:#1A2A4F; margin-bottom:3px; font-style:italic;">Directeur</div>
        <div style="width:90px; height:1px; background:#1A2A4F; margin-bottom:5px;"></div>
        <div style="font-family:'Jost', sans-serif; font-size:10px; color:#8AACBE; font-weight:700; text-transform:uppercase;">${director.toUpperCase()}</div>
      </div>
      
      <!-- Right: QR Code -->
      <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
        <div style="padding:10px; background:#F9F9F9; border-radius:8px; border:1px solid #EEE;">
           <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://smartcert.app/verify/${cid}" alt="QR Code" style="width:55px; height:55px; display:block;" />
        </div>
        <div style="font-family:'Jost', sans-serif; font-size:7px; color:#C9A03D; font-weight:700; text-transform:uppercase; margin-top:8px;">Verified on Blockchain</div>
        <div style="font-family:'Space Mono', monospace; font-size:6.5px; color:#8AACBE; margin-top:2px;">TX: ${tx.substring(0, 12)}...</div>
      </div>
      
    </div>

    <!-- Network Info -->
    <div style="margin-top:20px; font-family:'Space Mono', monospace; font-size:7px; color:rgba(110,162,179,0.5);">
      BLOCKCHAIN: ETHEREUM_GANACHE | ID: ${cid}
    </div>

  </div>`;
    }
    function escH(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }
  </script>
  <script>
    const POSSIBLE = ['http://127.0.0.1:5000', 'http://localhost:5000'];
    let API = localStorage.getItem('smartcert_api') || 'http://127.0.0.1:5000';

    async function findBackend() {
      const token = localStorage.getItem('smartcert_token');
      for (const u of POSSIBLE) {
        try {
          const r = await fetch(u + '/chain/status', {
            headers: { 'Authorization': `Bearer ${token}` },
            signal: AbortSignal.timeout(2000)
          });
          if (r.ok) {
            API = u;
            localStorage.setItem('smartcert_api', u);
            return true;
          }
        } catch { }
      }
      return false;
    }

    async function checkBackend() {
      const ok = await findBackend();
      const bar = document.getElementById('apiStatusBar');
      if (!ok) bar.innerHTML = `<div class="api-status err">⚠ Backend non disponible — lancez <code style="background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px">python app.py</code> <button onclick="checkBackend()" style="margin-left:8px;background:var(--red);border:none;color:white;padding:3px 10px;border-radius:5px;cursor:pointer;font-size:11px">🔄 Réessayer</button></div>`;
      else bar.innerHTML = '';
    }

    window.addEventListener('load', async () => {
      const token = localStorage.getItem('smartcert_token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const uStr = localStorage.getItem('smartcert_user');
      if (uStr) {
        try {
          const o = JSON.parse(uStr);
          document.getElementById('studentName').textContent = o.name || 'Étudiant';
          document.getElementById('studentEmail').textContent = o.email || '—';
          document.getElementById('studentAvatar').textContent = (o.name || o.email || 'E')[0].toUpperCase();
        } catch { }
      }

      const id = new URLSearchParams(window.location.search).get('id');
      if (id) {
        document.getElementById('certIdInput').value = id;
        verifyCert();
      }
      await checkBackend();
    });

    let isVerifying = false;
    async function verifyCert() {
      if (isVerifying) return;
      const idInput = document.getElementById('certIdInput');
      const id = idInput.value.trim();
      const area = document.getElementById('finalCertOutput');
      const btn = document.getElementById('verifyBtn');

      if (!id) { toast('⚠ Entrez un identifiant', 'error'); return; }

      isVerifying = true;
      btn.disabled = true;
      btn.style.opacity = "0.7";
      btn.innerHTML = 'Vérification...';
      area.innerHTML = '<div style="color:var(--sky);font-size:13px;padding:30px 0;text-align:center;background:rgba(0,0,0,0.2);border-radius:10px;">⌛ Interrogation de la blockchain Ethereum...</div>';

      try {
        const token = localStorage.getItem('smartcert_token');
        const res = await fetch(`${API}/certificates/verify/${encodeURIComponent(id)}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) {
          localStorage.removeItem('smartcert_token');
          window.location.href = 'login.html';
          return;
        }

        const data = await res.json();

        if (res.status === 404 || !data.valid) {
          area.innerHTML = buildInvalid(data, id);
          toast('❌ Certificat introuvable', 'error');
        } else {
          // Force direct rendering
          area.innerHTML = buildValidResult(data);
          toast('✅ Certificat authentique !', 'success');
        }
      } catch (err) {
        console.error("Verification Error:", err);
        if (!area.innerHTML.includes('result-wrap')) {
          area.innerHTML = `<div class="result-invalid"><p style="color:var(--red)">🔌 Erreur : Backend non joignable</p></div>`;
        }
      } finally {
        isVerifying = false;
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.innerHTML = '⚡ Vérifier';
      }
    }

    function buildValidResult(d) {
      return `
    <div class="result-wrap">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <span style="font-size:22px">✅</span>
        <div><div style="font-size:15px;font-weight:700;color:var(--green)">Certificat Authentique</div>
        <div style="font-size:11px;color:var(--sky)">Vérifié sur la blockchain Ethereum</div></div>
      </div>
      ${buildCertHTML(d)}
      ${d.blockchain_hash ? `<div class="hash-label">⛓ Hash Blockchain (SHA-256)</div><div class="hash-box">${escH(d.blockchain_hash)}</div>` : ''}
      <a class="btn-pdf" href="${API}/certificates/${escH(d.id || d.cert_id || '')}/pdf?token=${localStorage.getItem('smartcert_token')}" target="_blank">⬇ Télécharger le PDF</a>
    </div>`;
    }

    function buildInvalid(d, id) {
      return `<div class="result-invalid"><div style="font-size:16px;color:var(--red);margin-bottom:8px">❌ Certificat Invalide ou Introuvable</div><p style="font-size:13px;color:var(--sky)">${escH(d.message || 'Aucun enregistrement trouvé.')}</p><p style="font-size:12px;color:var(--sky);margin-top:8px">ID : <strong style="color:var(--accent);font-family:monospace">${escH(id)}</strong></p></div>`;
    }

    function escH(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }

    async function logout() {
      try {
        const token = localStorage.getItem('smartcert_token');
        await fetch(`${API}/auth/logout`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });
      } catch (e) { }
      localStorage.removeItem('smartcert_token');
      localStorage.removeItem('smartcert_user');
      window.location.href = 'login.html';
    }

    function toast(msg, type = 'success') { const box = document.getElementById('toastBox'); const el = document.createElement('div'); el.className = `toast ${type}`; el.textContent = msg; box.appendChild(el); setTimeout(() => { el.style.transition = 'opacity .4s,transform .4s'; el.style.opacity = '0'; el.style.transform = 'translateX(110%)'; setTimeout(() => el.remove(), 400) }, 3200) }
  </script>
</body>

</html>
