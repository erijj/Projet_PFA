<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCert — Connexion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="login.css" rel="stylesheet">
</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo + Titre -->
      <div class="form-header">
        <img src="../shared/logo.png" alt="SmartCert"
          style="width:80px;height:56px;object-fit:contain;display:block;margin:0 auto 12px"
          onerror="this.style.display='none'">
        <h2>SmartCert</h2>
        <p>Blockchain Certifications</p>
      </div>

      <!-- Alerte erreur -->
      <div class="form-alert err" id="alert-error">
        <i class="fas fa-circle-exclamation"></i>
        <span id="alert-msg">Identifiants incorrects.</span>
      </div>

      <!-- Formulaire -->
      <form onsubmit="handleLogin(event)" novalidate>

        <label class="form-label">Adresse email</label>
        <div class="input-wrap">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email-input" placeholder="exemple@smartcert.tn" autocomplete="email" required>
        </div>

        <label class="form-label">Mot de passe</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="pw-input" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="eye-btn" onclick="togglePw()">
            <i class="fas fa-eye" id="pw-eye"></i>
          </button>
        </div>

        <button type="submit" class="btn-submit" id="login-btn">
          <i class="fas fa-arrow-right-to-bracket"></i>
          Se connecter
        </button>

      </form>

      <div class="divider"><span>SmartCert · Blockchain Certifications</span></div>
      <div class="register-row">
        <a href="accueil.html">
          <i class="fas fa-arrow-left me-1"></i> Retour à l'accueil
        </a>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = localStorage.getItem('smartcert_api') || 'http://127.0.0.1:5000';

    const REDIRECTS = {
      admin: '../dashboard/dashboard.html',
      etudiant: '../frontend/dashboard-admin.html',
    };

    function togglePw() {
      const input = document.getElementById('pw-input');
      const icon = document.getElementById('pw-eye');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    }

    async function handleLogin(e) {
      e.preventDefault();

      const btn = document.getElementById('login-btn');
      const email = document.getElementById('email-input').value.trim();
      const pw = document.getElementById('pw-input').value;
      const errBox = document.getElementById('alert-error');
      const errMsg = document.getElementById('alert-msg');

      errBox.classList.remove('show');

      if (!email || !pw) {
        errMsg.textContent = 'Veuillez remplir tous les champs.';
        errBox.classList.add('show');
        return;
      }

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password: pw }),
        });

        const data = await res.json();

        if (!res.ok) {
          errMsg.textContent = data.error || 'Identifiants incorrects.';
          errBox.classList.add('show');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Se connecter';
          return;
        }

        // Succès — cookie posé automatiquement par le navigateur
        sessionStorage.setItem('smartcert_user', JSON.stringify(data.user));
        btn.innerHTML = '<i class="fas fa-circle-check"></i> Connecté !';
        btn.style.background = 'linear-gradient(135deg,#059669,#10B981)';

        const role = data.user?.role || 'admin';
        const dest = REDIRECTS[role] || REDIRECTS.admin;
        setTimeout(() => window.location.href = dest, 700);

      } catch (err) {
        errMsg.textContent = 'Backend inaccessible — vérifiez que Flask tourne sur ' + API_BASE;
        errBox.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Se connecter';
      }
    }
  </script>
</body>

</html>
