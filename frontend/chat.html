<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCert — Assistant Intelligent</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    :root {
      --navy:  #0B3948;
      --navy2: #416165;
      --dark:  #416165;
      --blue:  #ACB0BD;
      --teal:  #D9DBF1;
      --tealb: rgba(217, 219, 241, 0.25);
      --sky:   #ACB0BD;
      --pale:  #F1F3F9;
      --muted: #D0CDD7;
      --white: #ffffff;
      --green: #22d4a0;
      --grad:  linear-gradient(135deg, #0B3948 0%, #416165 100%);
      --ff:    "Cormorant Garamond", Georgia, serif;
      --fb:    "Jost", sans-serif;
      --border: rgba(217, 219, 241, 0.22);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      font-family: var(--fb);
      background: var(--navy);
      color: var(--pale);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 700px 500px at 15% 20%, rgba(217, 219, 241, 0.08), transparent),
        radial-gradient(ellipse 600px 400px at 85% 80%, rgba(65, 97, 101, 0.18), transparent);
    }

    /* ── NAVBAR ── */
    .navbar {
      flex-shrink: 0;
      background: rgba(11, 57, 72, 0.9);
      border-bottom: 1px solid var(--tealb);
      backdrop-filter: blur(20px);
      padding: 10px 25px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .navbar-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-logo { height: 46px; width: auto; }
    .brand-name {
      font-family: var(--ff); font-size: 1.55rem; font-weight: 700;
      background: linear-gradient(90deg, #ffffff 0%, #ACB0BD 50%, #D9DBF1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .brand-tag { font-size: 0.58rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--pale); margin-top: 2px; }

    .nav-right { display: flex; align-items: center; gap: 10px; }
    .btn-home {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 14px; background: rgba(15,168,192,0.07);
      border: 1px solid var(--tealb); border-radius: 100px;
      color: var(--sky); font-size: 0.72rem; font-weight: 600;
      text-decoration: none; transition: all .2s;
    }
    .btn-home:hover { background: rgba(217, 219, 241, 0.16); color: #fff; border-color: var(--teal); }

    /* ── MAIN LAYOUT ── */
    .app-main { display: flex; flex: 1; overflow: hidden; }

    /* ── CHAT AREA ── */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.1); }
    .messages { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }

    .msg { display: flex; gap: 12px; max-width: 80%; animation: slideUp .3s ease forwards; position: relative; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .av { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .av.bot { background: rgba(217, 219, 241, 0.15); border: 1px solid var(--tealb); }
    .av.user { background: var(--grad); }

    .bubble-wrap { display: flex; flex-direction: column; }
    .msg.user .bubble-wrap { align-items: flex-end; }

    .bubble { padding: 12px 16px; border-radius: 15px; font-size: 0.88rem; line-height: 1.6; }
    .bubble.bot { background: rgba(11, 57, 72, 0.6); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .bubble.user { background: var(--grad); color: #fff; border-bottom-right-radius: 2px; }

    .msg-time { font-size: 0.65rem; color: var(--muted); margin-top: 4px; padding: 0 5px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { 
        padding: 5px 12px; background: rgba(217, 219, 241, 0.1); border: 1px solid var(--tealb);
        border-radius: 100px; font-size: 0.72rem; color: var(--sky); cursor: pointer; transition: 0.2s;
    }
    .chip:hover { background: rgba(217, 219, 241, 0.2); border-color: var(--teal); }

    /* ── INPUT BAR ── */
    .input-container { padding: 20px; background: rgba(11, 57, 72, 0.9); border-top: 1px solid var(--border); }
    .input-row { display: flex; gap: 10px; background: rgba(65, 97, 101, 0.4); border: 1px solid var(--border); border-radius: 15px; padding: 5px; }
    .msg-input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px 15px; outline: none; resize: none; max-height: 100px; }
    .send-btn { width: 45px; height: 45px; background: var(--grad); border: none; border-radius: 12px; color: #fff; cursor: pointer; }

    /* ── FOOTER ── */
    footer { padding: 15px; border-top: 1px solid var(--tealb); background: var(--navy); text-align: center; }
    .footer-copy { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="navbar-brand" href="../dashboard/dashboard-admin.html">
        <img src="logo.png" alt="Logo" class="brand-logo" >
        <div>
            <div class="brand-name">SmartCert</div>
            <div class="brand-tag">DIGITALISEZ VOTRE RÉUSSITE</div>
        </div>
    </a>
    <div class="nav-right">
      <a href="smartcert.html" class="btn-home"><i class="fas fa-house"></i> Accueil</a>
      <a href="dashboard_admin.html" class="btn-home"><i class="fas fa-chart-line"></i> Dashboard_candidat</a>
    </div>
  </nav>

  <div class="app-main">
    <main class="chat-area">
      <div class="messages" id="messages"></div>
      
      <div class="input-container">
        <div class="input-row">
          <textarea id="msgInput" class="msg-input" placeholder="Posez votre question..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" onclick="sendMessage()">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <div class="footer-copy">
      &copy; 2026 SmartCert — Blockchain · Ethereum · Web3.py · Flask · SQLite
    </div>
  </footer>

  <script>
    let WEBHOOK_URL = localStorage.getItem('smartcert_webhook') || 'https://unstation-unelucidative-lisa.ngrok-free.dev/webhook/smartcert-chat';
    let sessionId = 'session-' + Math.random().toString(36).substr(2, 9);

    function getTime() {
      const now = new Date();
      return now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    }

    function md(text) {
      return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/`(.*?)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
    }

    function addMsg(text, isUser, suggestions = []) {
      const box = document.getElementById('messages');
      const el = document.createElement('div');
      el.className = 'msg ' + (isUser ? 'user' : 'bot');
      const avatar = `<div class="av ${isUser ? 'user' : 'bot'}">${isUser ? '👤' : '🤖'}</div>`;
      const chips = (!isUser && suggestions.length) ? `<div class="chips">${suggestions.map(s => `<span class="chip" onclick="sendMessage('${s.replace(/'/g,"\\'")}')">${s}</span>`).join('')}</div>` : '';
      const time = getTime();

      el.innerHTML = `
        ${avatar}
        <div class="bubble-wrap">
          <div class="bubble ${isUser ? 'user' : 'bot'}">${isUser ? text : md(text)}</div>
          <div class="msg-time">${time}</div>
          ${chips}
        </div>
      `;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage(txt) {
      const inp = document.getElementById('msgInput');
      const msg = txt || inp.value.trim();
      if (!msg) return;
      if (!txt) { inp.value = ''; autoResize(inp); }
      addMsg(msg, true);
      showTyping();
      const result = await callWebhook(msg);
      hideTyping();
      addMsg(result.message, false, result.suggestions);
    }

    function showTyping() {
      const box = document.getElementById('messages');
      const el = document.createElement('div');
      el.id = 'typing'; el.className = 'msg bot';
      el.innerHTML = `<div class="av bot">🤖</div><div class="bubble bot">...</div>`;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }
    function hideTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }

    async function callWebhook(message) {
      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, session_id: sessionId })
        });
        const data = await res.json();
        return { message: data.message || 'Réponse reçue.', suggestions: data.suggestions || [] };
      } catch (err) { return demoResponse(message); }
    }

    function demoResponse(msg) {
        const lo = msg.toLowerCase();
        if (/bonjour|salut/.test(lo)) return { message: "Bienvenue sur **SmartCert** ! (Mode Démo). Connectez votre Webhook pour le vrai chat.", suggestions: ["Blockchain ?", "Vérifier un ID"] };
        return { message: "Je suis en mode démo. Configurez votre URL N8N pour interagir avec mon intelligence réelle.", suggestions: ["Aide"] };
    }

    function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
    function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

    window.onload = () => addMsg("Bienvenue sur **SmartCert**. Comment puis-je vous aider ?", false, [' Obtenir un certificat', ' télecharger pdf', ' Sécurité blockchain', ' email non recu']);
  </script>
</body>
</html>
