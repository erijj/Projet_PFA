<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCert — Connexion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy:       #001d39;
      --blue-dark:  #0a4174;
      --teal:       #4e8ea2;
      --blue-sky:   #7bbde8;
      --blue-pale:  #bdd8e9;
      --text-muted: #6ea2b3;
      --gradient:   linear-gradient(135deg, #0a4174, #4e8ea2);
      --border:     rgba(78,142,162,0.22);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--navy);
      color: var(--blue-pale);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    h1,h2,h3,h4 { font-family: "Syne", sans-serif; }

    .bg-orb { position: fixed; border-radius: 50%; pointer-events: none; }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(78,142,162,.18) 0%, transparent 70%);
      top: -160px; left: -120px;
    }
    .orb-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(10,65,116,.35) 0%, transparent 70%);
      bottom: -110px; right: -60px;
    }

    .login-card {
      background: rgba(10,65,116,.5);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
      animation: fadeUp .65s ease both;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }

    .logo-img {
      width: 80px; height: 56px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
    }
    .brand-name {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--blue-sky);
      text-align: center;
      margin-bottom: 2px;
    }
    .brand-tag {
      text-align: center;
      color: var(--text-muted);
      font-size: .78rem;
      letter-spacing: .8px;
      margin-bottom: 28px;
    }

    .alert-session {
      background: rgba(251,191,36,.1);
      border: 1px solid rgba(251,191,36,.3);
      color: #fbbf24;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .82rem;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background: rgba(248,113,113,.12);
      border: 1px solid rgba(248,113,113,.3);
      color: #fca5a5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .82rem;
      margin-bottom: 18px;
      display: none;
    }

    .role-tabs {
      display: flex;
      background: rgba(0,29,57,.5);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 26px;
      border: 1px solid var(--border);
    }
    .role-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      border-radius: 8px;
      font-size: .84rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .22s;
      border: none;
      background: transparent;
      font-family: "DM Sans", sans-serif;
    }
    .role-tab.active {
      background: var(--gradient);
      color: #fff;
      box-shadow: 0 4px 14px rgba(78,142,162,.4);
    }
    .role-tab:hover:not(.active) { color: var(--blue-sky); }

    .form-label { font-size: .84rem; color: var(--text-muted); margin-bottom: 6px; }
    .input-wrap { position: relative; margin-bottom: 18px; }
    .field {
      width: 100%;
      background: rgba(0,29,57,.6);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 40px 12px 38px;
      color: var(--blue-pale);
      font-size: .9rem;
      outline: none;
      transition: border-color .25s;
      font-family: "DM Sans", sans-serif;
    }
    .field:focus { border-color: var(--teal); }
    .field::placeholder { color: var(--text-muted); }
    .field.error { border-color: rgba(248,113,113,.6); }
    .icon-left {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); font-size: .85rem; pointer-events: none;
    }
    .toggle-pw {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); cursor: pointer;
      background: none; border: none; padding: 0; font-size: .85rem;
    }
    .toggle-pw:hover { color: var(--blue-sky); }

    .btn-login {
      width: 100%;
      background: var(--gradient);
      border: none; color: #fff;
      padding: 14px; border-radius: 10px;
      font-weight: 600; font-size: .94rem;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
      box-shadow: 0 4px 20px rgba(78,142,162,.35);
      font-family: "DM Sans", sans-serif;
      margin-top: 6px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(78,142,162,.5);
    }
    .btn-login:disabled { opacity: .7; cursor: not-allowed; transform: none; }

    .demo-hint {
      background: rgba(78,142,162,.08);
      border: 1px solid rgba(78,142,162,.2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .75rem;
      color: var(--text-muted);
      margin-top: 16px;
      display: none;
    }
    .demo-hint strong { color: var(--blue-sky); }

    .divider {
      display: flex; align-items: center; gap: 12px; margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .divider span { font-size: .74rem; color: var(--text-muted); white-space: nowrap; }

    .back-link {
      display: block; text-align: center;
      font-size: .82rem; color: var(--text-muted);
      text-decoration: none; transition: color .2s;
    }
    .back-link:hover { color: var(--blue-sky); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      .login-card { padding: 36px 22px; margin: 16px; }
    }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="login-card">

    <img class="logo-img" src="../shared/logo.png" alt="SmartCert"
         onerror="this.style.display='none'">
    <div class="brand-name">SmartCert</div>
    <div class="brand-tag">Blockchain Certifications</div>

    <div class="alert-session" id="alert-session">
      <i class="fas fa-clock me-1"></i>
      <span id="session-msg">Votre session a expiré. Veuillez vous reconnecter.</span>
    </div>

    <div class="alert-error" id="alert-error">
      <i class="fas fa-circle-exclamation me-1"></i>
      <span id="error-msg">Email ou mot de passe incorrect.</span>
    </div>

    <div class="role-tabs" role="tablist">
      <button class="role-tab active" id="tab-admin"
              onclick="switchRole('admin')">
        <i class="fas fa-user-shield me-1"></i>Admin
      </button>
      <button class="role-tab" id="tab-etudiant"
              onclick="switchRole('etudiant')">
        <i class="fas fa-graduation-cap me-1"></i>Étudiant
      </button>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" novalidate>

      <label class="form-label" for="email-input">Adresse email</label>
      <div class="input-wrap">
        <i class="fas fa-envelope icon-left"></i>
        <input type="email" class="field" id="email-input"
               placeholder="exemple@smartcert.tn" autocomplete="email" required>
      </div>

      <label class="form-label" for="pw-input">Mot de passe</label>
      <div class="input-wrap">
        <i class="fas fa-lock icon-left"></i>
        <input type="password" class="field" id="pw-input"
               placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" onclick="togglePw()">
          <i class="fas fa-eye" id="pw-eye"></i>
        </button>
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        <i class="fas fa-arrow-right-to-bracket"></i>
        Se connecter
      </button>
    </form>

    <div class="demo-hint" id="demo-hint">
      <i class="fas fa-circle-info me-1"></i>
      Démo : <strong id="demo-email">admin@smartcert.tn</strong> /
      <strong id="demo-pw">admin123</strong>
    </div>

    <div class="divider"><span>SmartCert · Blockchain Certifications</span></div>
    <a href="../frontend/accueil.html" class="back-link">
      <i class="fas fa-arrow-left me-1"></i> Retour à l'accueil
    </a>

  </div>

  <script>
    // ─── CONFIG ───────────────────────────────────────────
    const API_BASE = localStorage.getItem('smartcert_api') || 'http://127.0.0.1:5000';

    // Redirections selon le rôle — adaptées à la structure du projet
    const ROLE_REDIRECTS = {
      admin:    '../dashboard/dashboard.html',
      etudiant: '../certificates/dashboard_condidat.html',
    };

    const DEMO_HINTS = {
      admin:    { email: 'admin@smartcert.tn',    pw: 'admin123'    },
      etudiant: { email: 'etudiant@smartcert.tn', pw: 'etudiant123' },
    };

    let currentRole  = 'admin';
    let attemptCount = 0;

    // ─── AU CHARGEMENT ────────────────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
      // Afficher message selon query param
      const reason = new URLSearchParams(window.location.search).get('reason');
      if (reason) {
        const msgs = {
          session_expired: 'Votre session a expiré. Veuillez vous reconnecter.',
          logged_out:      'Vous avez été déconnecté avec succès.',
          unauthorized:    "Accès refusé. Vous n'avez pas les permissions nécessaires.",
        };
        if (msgs[reason]) {
          const el = document.getElementById('alert-session');
          document.getElementById('session-msg').textContent = msgs[reason];
          el.style.display = 'block';
          if (reason === 'unauthorized') {
            el.style.background = 'rgba(248,113,113,.1)';
            el.style.color = '#fca5a5';
          }
        }
      }

      // Si déjà connecté via cookie → vérifier et rediriger
      if (!reason) {
        try {
          const res  = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
          const data = await res.json();
          if (data.authenticated && data.user) {
            const dest = ROLE_REDIRECTS[data.user.role] || ROLE_REDIRECTS.admin;
            window.location.replace(dest);
          }
        } catch (_) { /* backend hors ligne — rester sur la page */ }
      }

      // Pré-remplir email
      document.getElementById('email-input').value = DEMO_HINTS[currentRole].email;
    });

    // ─── SWITCH RÔLE ──────────────────────────────────────
    function switchRole(role) {
      currentRole = role;
      document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
      document.getElementById('tab-etudiant').classList.toggle('active', role === 'etudiant');
      document.getElementById('alert-error').style.display = 'none';
      document.getElementById('demo-hint').style.display   = 'none';
      document.getElementById('email-input').value = DEMO_HINTS[role].email;
      document.getElementById('pw-input').value    = '';
    }

    // ─── TOGGLE MOT DE PASSE ──────────────────────────────
    function togglePw() {
      const input = document.getElementById('pw-input');
      const icon  = document.getElementById('pw-eye');
      const show  = input.type === 'password';
      input.type  = show ? 'text' : 'password';
      icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    }

    // ─── SOUMISSION ───────────────────────────────────────
    async function handleLogin(e) {
      e.preventDefault();
      const btn   = document.getElementById('login-btn');
      const email = document.getElementById('email-input').value.trim();
      const pw    = document.getElementById('pw-input').value;

      document.getElementById('alert-error').style.display = 'none';
      document.getElementById('alert-session').style.display = 'none';
      document.getElementById('email-input').classList.remove('error');
      document.getElementById('pw-input').classList.remove('error');

      if (!email || !pw) {
        showError('Veuillez remplir tous les champs.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion en cours…';

      try {
        // ── Appel API — credentials: 'include' pour recevoir le cookie ──
        const res  = await fetch(`${API_BASE}/auth/login`, {
          method:      'POST',
          headers:     { 'Content-Type': 'application/json' },
          credentials: 'include',   // ← OBLIGATOIRE pour les cookies HttpOnly
          body:        JSON.stringify({ email, password: pw }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Identifiants incorrects');

        // ── Succès — le cookie est posé automatiquement par le navigateur ──
        // Stocker infos utilisateur pour l'UI (pas de token JWT)
        const user = data.user;
        sessionStorage.setItem('smartcert_user', JSON.stringify(user));

        btn.innerHTML = '<i class="fas fa-circle-check"></i> Connecté !';
        btn.style.background = 'linear-gradient(135deg, #059669, #10B981)';
        btn.style.boxShadow  = '0 8px 24px rgba(16,185,129,.4)';

        // Rediriger selon le rôle retourné par le serveur
        const dest = ROLE_REDIRECTS[user.role] || ROLE_REDIRECTS.admin;
        setTimeout(() => window.location.href = dest, 700);

      } catch (err) {
        // ── Erreur réseau ──────────────────────────────────
        const isNetwork = err.name === 'TypeError' || err.message.includes('fetch');
        if (isNetwork) {
          showError('Serveur inaccessible. Vérifiez que Flask tourne sur ' + API_BASE);
        } else {
          showError(err.message);
        }

        attemptCount++;
        if (attemptCount >= 2) {
          const hint = DEMO_HINTS[currentRole];
          document.getElementById('demo-email').textContent = hint.email;
          document.getElementById('demo-pw').textContent    = hint.pw;
          document.getElementById('demo-hint').style.display = 'block';
        }

        document.getElementById('email-input').classList.add('error');
        document.getElementById('pw-input').classList.add('error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Se connecter';
        btn.style.background = '';
        btn.style.boxShadow  = '';
      }
    }

    function showError(msg) {
      document.getElementById('error-msg').textContent = msg;
      document.getElementById('alert-error').style.display = 'block';
    }
  </script>
</body>
</html>
